<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crear cuenta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .contenedor {
      width: 100%;
      max-width: 450px;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #222;
    }

    .campo {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #4f46e5;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    #mensaje {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .exito {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Crear cuenta</h1>

    <form id="registroForm">

      <div class="campo">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          required
        >
      </div>

      <div class="campo">
        <label for="apellido">Apellido</label>
        <input
          type="text"
          id="apellido"
          name="apellido"
          required
        >
      </div>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          required
        >
      </div>

      <div class="campo">
        <label for="telefono">Teléfono</label>
        <input
          type="tel"
          id="telefono"
          name="telefono"
          required
        >
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="6"
        >
      </div>

      <button type="submit">
        Registrarme
      </button>

    </form>

    <div id="mensaje"></div>

  </div>

  <script>
    const formulario = document.getElementById("registroForm");
    const mensaje = document.getElementById("mensaje");

    formulario.addEventListener("submit", async (event) => {

      event.preventDefault();

      mensaje.textContent = "Registrando...";
      mensaje.className = "";

      const datos = {
        nombre: document.getElementById("nombre").value,
        apellido: document.getElementById("apellido").value,
        email: document.getElementById("email").value,
        telefono: document.getElementById("telefono").value,
        password: document.getElementById("password").value
      };

      try {

        const respuesta = await fetch("/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(datos)
        });

        const resultado = await respuesta.json();

        if (!respuesta.ok) {
          throw new Error(
            resultado.error || "Error registrando usuario"
          );
        }

        mensaje.textContent =
          "¡Usuario registrado correctamente!";

        mensaje.className = "exito";

        formulario.reset();

      } catch (error) {

        console.error(error);

        mensaje.textContent = error.message;
        mensaje.className = "error";
      }
    });
  </script>

</body>
</html>
